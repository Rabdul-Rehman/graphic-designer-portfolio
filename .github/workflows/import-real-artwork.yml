name: Import real portfolio artwork
on:
  push:
    branches: [main]
    paths:
      - 'portfolio-real-artwork-ready.zip'
      - '.github/workflows/import-real-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract uploaded portfolio
        run: |
          unzip -o portfolio-real-artwork-ready.zip -d .
          rm -f portfolio-real-artwork-ready.zip
      - name: Commit real logos and posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish real portfolio logos and poster gallery"
            git push origin HEAD:main
          fi
