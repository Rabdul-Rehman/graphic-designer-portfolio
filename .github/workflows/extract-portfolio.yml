name: Extract portfolio ZIP
on:
  push:
    branches: [main]
    paths:
      - 'graphic-designer-portfolio-cloudflare-ready.zip'
      - '.github/workflows/extract-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract portfolio files
        run: |
          unzip -o graphic-designer-portfolio-cloudflare-ready.zip -d .
          rm -f graphic-designer-portfolio-cloudflare-ready.zip
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract portfolio source for Cloudflare deployment"
            git push origin HEAD:main
          fi
